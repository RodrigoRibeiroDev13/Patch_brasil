<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Patch Brasil - PLS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0d2b18 0%, #06120a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container-loading {
            width: 100%;
            max-width: 480px;
            background: rgba(20, 35, 25, 0.85);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 16px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .badge {
            display: inline-block;
            background: #00c853;
            color: #05140a;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitulo {
            font-size: 13px;
            color: #a5d6a7;
            margin-bottom: 28px;
        }

        /* Barra de Progresso */
        .barra-fundo {
            width: 100%;
            height: 18px;
            background-color: #0a170e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1b4328;
            margin-bottom: 12px;
        }

        .barra-preenchimento {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c853, #69f0ae);
            border-radius: 10px;
            transition: width 0.25s ease-out;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
        }

        .info-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #cfd8dc;
            margin-bottom: 22px;
        }

        .porcentagem {
            font-weight: bold;
            color: #00e676;
            font-size: 15px;
        }

        /* Botão que aparece ao concluir */
        .btn-continuar {
            display: none;
            width: 100%;
            padding: 14px;
            background: #00e676;
            color: #041208;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.15s, background 0.2s;
        }

        .btn-continuar:active {
            transform: scale(0.98);
            background: #00c853;
        }
    </style>
</head>
<body>

    <div class="container-loading">
        <span class="badge">Database Brasil</span>
        <h1>PATCH FUTEBOL BR</h1>
        <p class="subtitulo">Séries A, B, C, D e Estaduais (1ª, 2ª e 3ª Div.)</p>

        <div class="barra-fundo">
            <div class="barra-preenchimento" id="barra"></div>
        </div>

        <div class="info-linha">
            <span id="status-texto">Iniciando carregamento...</span>
            <span class="porcentagem" id="porcentagem">0%</span>
        </div>

        <button class="btn-continuar" id="btn-entrar" onclick="abrirDestino()">
            Acessar Arquivos do Patch
        </button>
    </div>

    <script>
        const barra = document.getElementById('barra');
        const statusTexto = document.getElementById('status-texto');
        const porcentagemTexto = document.getElementById('porcentagem');
        const btnEntrar = document.getElementById('btn-entrar');

        // Etapas exibidas durante o carregamento
        const etapas = [
            { limite: 20, texto: "Carregando Brasileirão Séries A e B..." },
            { limite: 45, texto: "Carregando Séries C e D..." },
            { limite: 70, texto: "Sincronizando Estaduais (1ª, 2ª e 3ª Div.)..." },
            { limite: 90, texto: "Verificando escudos e uniformes..." },
            { limite: 100, texto: "Database pronta!" }
        ];

        let progresso = 0;

        const intervalo = setInterval(() => {
            // Incremento variável para parecer carregamento real
            progresso += Math.floor(Math.random() * 6) + 2;

            if (progresso >= 100) {
                progresso = 100;
                clearInterval(intervalo);
                btnEntrar.style.display = 'block';
            }

            barra.style.width = progresso + '%';
            porcentagemTexto.textContent = progresso + '%';

            // Atualiza o texto conforme a porcentagem atual
            for (let etapa of etapas) {
                if (progresso <= etapa.limite) {
                    statusTexto.textContent = etapa.texto;
                    break;
                }
            }
        }, 120);

        function abrirDestino() {
            // Troque o link abaixo pela URL da sua página de links ou arquivo JSON
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
